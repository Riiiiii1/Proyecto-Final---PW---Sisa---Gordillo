spring:
  application:
    name: academic-events-api

  profiles:
    active: dev

  flyway:
    enabled: false
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5444/academic_events_db
    username: postgres
    password: manager
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Guayaquil
    show-sql: true

  data:
    redis:
      host: leg-soup-increase-73781.db.redis.io
      port: 19635
      password: CMHbzNqfSdxB1n9FavJECqKZj3qxPjwb

  jackson:
    time-zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api

app:
  timezone:
    business: America/Guayaquil

jwt:
  secret: ${JWT_SECRET:cambia-este-secreto-en-produccion-por-uno-largo-y-seguro-de-al-menos-256-bits}
  expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  issuer: academic-events-api
  token-prefix: "Bearer "
  header-name: "Authorization"

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

rate-limit:
  login-limit: 5
  login-window-seconds: 60
  register-limit: 3
  register-window-seconds: 3600
  public-limit: 60
  public-window-seconds: 60
  authenticated-limit: 120
  authenticated-window-seconds: 60
  reports-limit: 5
  reports-window-seconds: 60