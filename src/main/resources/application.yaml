spring:
  application:
    name: academic-events-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api

app:
  timezone:
    business: America/Guayaquil

jwt:
  expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  issuer: academic-events-api
  token-prefix: "Bearer "
  header-name: "Authorization"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

rate-limit:
  login-limit: 5
  login-window-seconds: 60
  register-limit: 3
  register-window-seconds: 3600
  public-limit: 60
  public-window-seconds: 60
  authenticated-limit: 120
  authenticated-window-seconds: 60
  reports-limit: 5
  reports-window-seconds: 60